<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meepno Desktop</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100vh;
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
}

/* Background Canvas */
#canvas-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
}

body.cosmic-mode #canvas-bg {
    opacity: 1;
}

/* Main Layout Container */
.main-wrapper {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Logo */
.brand-title {
    font-size: 42px;
    font-weight: 200;
    letter-spacing: 6px;
    color: #ffffff;
    margin-bottom: 28px;
    user-select: none;
    text-transform: uppercase;
}

/* Search Box Container */
.search-container {
    position: relative;
    width: 100%;
    max-width: 540px;
}

.search-form {
    width: 100%;
}

.search-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    padding: 12px 16px;
    color: #ff9500;
    font-size: 20px;
    font-weight: 300;
    outline: none;
    direction: ltr;
    text-align: left;
    transition: border-color 0.3s ease;
}

.search-input::placeholder {
    color: rgba(255, 149, 0, 0.4);
    font-weight: 200;
}

.search-input:focus {
    border-bottom-color: #ff9500;
}

/* Desktop Suggestions Dropdown */
.desktop-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-top: none;
    border-radius: 0 0 12px 12px;
    margin-top: 4px;
    max-height: 300px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: 0 15px 30px rgba(0,0,0,0.8);
}

.dropdown-item {
    padding: 12px 18px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 300;
    cursor: pointer;
    text-align: left;
    direction: ltr;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    transition: background 0.15s ease;
}

.dropdown-item:hover, .dropdown-item.active {
    background: rgba(255, 255, 255, 0.12);
}

/* Cosmic Button */
.toggle-btn {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 5;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.5);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.toggle-btn:hover {
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.4);
}
</style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="main-wrapper">
        <div class="brand-title">MEEPNO</div>
        
        <div class="search-container">
            <form id="mainSearchForm" class="search-form" action="https://www.google.com/search" method="GET">
                <input 
                    type="search" 
                    name="q"
                    id="mainSearchInput" 
                    class="search-input" 
                    placeholder="جستجو..." 
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="none"
                    spellcheck="false"
                    inputmode="search"
                    enterkeyhint="search"
                    autofocus
                />
            </form>
            <div id="desktopDropdown" class="desktop-dropdown"></div>
        </div>
    </div>

    <button id="cosmicToggle" class="toggle-btn">Cosmic Mode</button>

<script>
"use strict";

const mainSearchInput = document.getElementById("mainSearchInput");
const mainSearchForm = document.getElementById("mainSearchForm");
const desktopDropdown = document.getElementById("desktopDropdown");
const cosmicToggle = document.getElementById("cosmicToggle");
const canvas = document.getElementById("canvas-bg");
const ctx = canvas.getContext("2d");

let debounceTimer = null;
let selectedIndex = -1;

/* ====================================
   سیستم پیشنهاد ۳ لایه (۳-Layer Fallback)
   ==================================== */

function fetchDesktopSuggestions(query) {
    const trimmed = query.trim();
    if (!trimmed) {
        desktopDropdown.style.display = "none";
        desktopDropdown.innerHTML = "";
        return;
    }

    // لایه اول: Fetch مستقیم از گوگل
    const primaryUrl = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(trimmed)}`;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 1200);

    fetch(primaryUrl, { signal: controller.signal })
        .then(res => res.json())
        .then(data => {
            clearTimeout(timeoutId);
            if (data && data[1] && data[1].length > 0) {
                renderDesktopResults(data[1]);
            } else {
                fetchSecondaryJSONP(trimmed);
            }
        })
        .catch(() => {
            fetchSecondaryJSONP(trimmed);
        });
}

// لایه دوم: Google JSONP
function fetchSecondaryJSONP(query) {
    const oldScript = document.getElementById("jsonp-desktop");
    if (oldScript) oldScript.remove();

    const callbackName = "__meepno_desk_" + Math.random().toString(36).substr(2, 9);
    const script = document.createElement("script");
    script.id = "jsonp-desktop";

    let hasResponded = false;

    window[callbackName] = function(res) {
        hasResponded = true;
        if (res && res[1] && res[1].length > 0) {
            renderDesktopResults(res[1]);
        } else {
            fetchDuckDuckGoFallback(query);
        }
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
    };

    setTimeout(() => {
        if (!hasResponded) {
            if (script.parentNode) script.parentNode.removeChild(script);
            fetchDuckDuckGoFallback(query);
        }
    }, 1000);

    script.src = `https://suggestqueries.google.com/complete/search?client=chrome&hl=fa&q=${encodeURIComponent(query)}&callback=${callbackName}`;
    document.body.appendChild(script);
}

// لایه سوم: DuckDuckGo Fallback
function fetchDuckDuckGoFallback(query) {
    const oldDdscript = document.getElementById("ddg-desktop");
    if (oldDdscript) oldDdscript.remove();

    const callbackName = "__meepno_ddg_" + Math.random().toString(36).substr(2, 9);
    const script = document.createElement("script");
    script.id = "ddg-desktop";

    window[callbackName] = function(res) {
        if (res && Array.isArray(res)) {
            const list = res.map(item => item.phrase);
            renderDesktopResults(list);
        }
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
    };

    script.src = `https://duckduckgo.com/ac/?callback=${callbackName}&q=${encodeURIComponent(query)}&type=list`;
    document.body.appendChild(script);
}

// رندر دراپ‌داون پیشنهادها
function renderDesktopResults(list) {
    desktopDropdown.innerHTML = "";
    selectedIndex = -1;

    if (!list || list.length === 0) {
        desktopDropdown.style.display = "none";
        return;
    }

    const fragment = document.createDocumentFragment();
    list.forEach(itemText => {
        const div = document.createElement("div");
        div.className = "dropdown-item";
        div.textContent = itemText;
        
        div.addEventListener("click", () => {
            window.location.href = `https://www.google.com/search?q=${encodeURIComponent(itemText)}`;
        });

        fragment.appendChild(div);
    });

    desktopDropdown.appendChild(fragment);
    desktopDropdown.style.display = "block";
}

// تایپ زنده با Debounce
mainSearchInput.addEventListener("input", function() {
    clearTimeout(debounceTimer);
    const val = this.value;
    debounceTimer = setTimeout(() => {
        fetchDesktopSuggestions(val);
    }, 150);
});

// مدیریت کلیدهای بالا/پایین و اینتر
mainSearchInput.addEventListener("keydown", function(e) {
    const items = desktopDropdown.querySelectorAll(".dropdown-item");
    if (items.length === 0) return;

    if (e.key === "ArrowDown") {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % items.length;
        updateSelection(items);
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
        updateSelection(items);
    } else if (e.key === "Enter" && selectedIndex >= 0) {
        e.preventDefault();
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(items[selectedIndex].textContent)}`;
    }
});

function updateSelection(items) {
    items.forEach((item, idx) => {
        if (idx === selectedIndex) {
            item.classList.add("active");
            mainSearchInput.value = item.textContent;
        } else {
            item.classList.remove("active");
        }
    });
}

document.addEventListener("click", function(e) {
    if (!e.target.closest(".search-container")) {
        desktopDropdown.style.display = "none";
    }
});

/* Cosmic Background Logic */
let particles = [];
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.2;
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.speedY = (Math.random() - 0.5) * 0.2;
        this.opacity = Math.random() * 0.5;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
    }
    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

for (let i = 0; i < 70; i++) particles.push(new Particle());

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
animate();

cosmicToggle.addEventListener("click", () => {
    document.body.classList.toggle("cosmic-mode");
});
</script>
</body>
</html>
