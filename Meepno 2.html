<script>
"use strict";

const searchInput2 = document.getElementById("searchInput2");
const searchForm = document.getElementById("searchForm");
const resultsList = document.getElementById("resultsList");

let debounceTimer = null;

// تابع گرفتن پیشنهادها با قابلیت هوشمند جایگزینی (Fallback)
function fetchLiveResults(query) {
    const trimmed = query.trim();
    if (!trimmed) {
        resultsList.innerHTML = "";
        return;
    }

    // لایه اول: استفاده از Fetch مستقیم
    const primaryUrl = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(trimmed)}`;

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 1200); // اگر ۱.۲ ثانیه طول کشید سریع میره لایه بعد

    fetch(primaryUrl, { signal: controller.signal })
        .then(res => res.json())
        .then(data => {
            clearTimeout(timeoutId);
            if (data && data[1] && data[1].length > 0) {
                renderResults(data[1]);
            } else {
                fetchSecondaryJSONP(trimmed);
            }
        })
        .catch(() => {
            // اگر لایه اول بلاک شد یا تایم‌اوت خورد -> لایه دوم
            fetchSecondaryJSONP(trimmed);
        });
}

// لایه دوم: اسکریپت JSONP سفارشی گوگل
function fetchSecondaryJSONP(query) {
    const oldScript = document.getElementById("jsonp-suggest");
    if (oldScript) oldScript.remove();

    const callbackName = "__meepno_cb_" + Math.random().toString(36).substr(2, 9);
    const script = document.createElement("script");
    script.id = "jsonp-suggest";

    let hasResponded = false;

    window[callbackName] = function(res) {
        hasResponded = true;
        if (res && res[1] && res[1].length > 0) {
            renderResults(res[1]);
        } else {
            fetchDuckDuckGoFallback(query);
        }
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
    };

    // اگر لایه دوم هم جواب نداد بعد از ۱ ثانیه میره لایه سوم
    setTimeout(() => {
        if (!hasResponded) {
            if (script.parentNode) script.parentNode.removeChild(script);
            fetchDuckDuckGoFallback(query);
        }
    }, 1000);

    script.src = `https://suggestqueries.google.com/complete/search?client=chrome&hl=fa&q=${encodeURIComponent(query)}&callback=${callbackName}`;
    document.body.appendChild(script);
}

// لایه سوم: موتور ذخیره و مطمئن DuckDuckGo (هرگز بلاک نمی‌کنه)
function fetchDuckDuckGoFallback(query) {
    const oldDdscript = document.getElementById("ddg-suggest");
    if (oldDdscript) oldDdscript.remove();

    const callbackName = "__meepno_ddg_" + Math.random().toString(36).substr(2, 9);
    const script = document.createElement("script");
    script.id = "ddg-suggest";

    window[callbackName] = function(res) {
        if (res && Array.isArray(res)) {
            const list = res.map(item => item.phrase);
            renderResults(list);
        }
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
    };

    script.src = `https://duckduckgo.com/ac/?callback=${callbackName}&q=${encodeURIComponent(query)}&type=list`;
    document.body.appendChild(script);
}

// رندر نتایج روی صفحه
function renderResults(list) {
    resultsList.innerHTML = "";
    if (!list || list.length === 0) return;

    const fragment = document.createDocumentFragment();
    list.forEach(itemText => {
        const div = document.createElement("div");
        div.className = "result-item";
        div.textContent = itemText;
        
        div.addEventListener("click", () => {
            window.location.href = `https://www.google.com/search?q=${encodeURIComponent(itemText)}`;
        });

        fragment.appendChild(div);
    });

    resultsList.appendChild(fragment);
}

// Debounce برای کنترل ترافیک درخواست‌ها
searchInput2.addEventListener("input", function() {
    clearTimeout(debounceTimer);
    const val = this.value;
    debounceTimer = setTimeout(() => {
        fetchLiveResults(val);
    }, 180);
});

// ارسال مستقیم فرم با Enter
searchForm.addEventListener("submit", function(e) {
    if (!searchInput2.value.trim()) {
        e.preventDefault();
    }
});
</script>
