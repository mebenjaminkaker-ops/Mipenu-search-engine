<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meepno 2</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100vh;
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

/* Header Area */
.search-header {
    width: 100%;
    padding: 20px 24px 14px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
}

/* Search Input: Top Left, Thin, Orange */
.search-input-page2 {
    background: transparent;
    border: none;
    outline: none;
    color: #ff9500;
    font-size: 20px;
    font-weight: 300;
    width: 100%;
    max-width: 600px;
    direction: ltr;
    text-align: left;
    letter-spacing: 0.5px;
}

.search-input-page2::placeholder {
    color: rgba(255, 149, 0, 0.5);
    font-weight: 200;
}

/* Remove default search clear buttons in Chrome/Safari */
.search-input-page2::-webkit-search-decoration,
.search-input-page2::-webkit-search-cancel-button,
.search-input-page2::-webkit-search-results-button,
.search-input-page2::-webkit-search-results-decoration {
    display: none;
}

/* Ultra-Thin Low-Contrast Divider Line Across Screen */
.divider-line {
    width: 100%;
    height: 1px;
    background-color: rgba(255, 255, 255, 0.12);
}

/* Results Container */
.results-container {
    width: 100%;
    padding: 20px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.result-item {
    color: #ffffff;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.5;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    cursor: pointer;
    text-align: left;
    direction: ltr;
    transition: opacity 0.2s ease;
}

.result-item:active {
    opacity: 0.6;
}

.loading-text {
    color: rgba(255, 255, 255, 0.4);
    font-size: 14px;
    font-weight: 200;
    text-align: left;
    direction: ltr;
    padding-top: 10px;
}
</style>
</head>
<body>

    <!-- Header Section -->
    <header class="search-header">
        <input 
            type="search" 
            id="searchInput2" 
            class="search-input-page2" 
            placeholder="جستجو..." 
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            inputmode="search"
            enterkeyhint="search"
            autofocus
        />
    </header>

    <!-- Ultra-Thin Divider Line -->
    <div class="divider-line"></div>

    <!-- Live Search Results -->
    <main id="resultsList" class="results-container"></main>

<script>
"use strict";

const searchInput2 = document.getElementById("searchInput2");
const resultsList = document.getElementById("resultsList");
let currentScript = null;

// ارسال سرچ به گوگل
function redirectToGoogle(query) {
    if (!query.trim()) return;
    window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query.trim())}`;
}

// ارسال درخواست زنده به API پیشنهادها
function fetchLiveResults(query) {
    if (!query.trim()) {
        resultsList.innerHTML = "";
        return;
    }

    if (currentScript) currentScript.remove();

    const callbackName = "__meepno_serp_cb_" + Date.now();
    const script = document.createElement("script");
    currentScript = script;

    window[callbackName] = function(data) {
        const results = (data && Array.isArray(data[1])) ? data[1] : [];
        renderResults(results);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
    };

    script.src = `https://suggestqueries.google.com/complete/search?client=chrome&callback=${encodeURIComponent(callbackName)}&q=${encodeURIComponent(query)}`;
    document.body.appendChild(script);
}

// رندر نتایج
function renderResults(list) {
    resultsList.innerHTML = "";

    if (!list || list.length === 0) {
        return;
    }

    const fragment = document.createDocumentFragment();
    list.forEach(itemText => {
        const div = document.createElement("div");
        div.className = "result-item";
        div.textContent = itemText;
        
        // کلیک روی هر نتیجه -> باز شدن توی گوگل
        div.addEventListener("click", () => {
            redirectToGoogle(itemText);
        });

        fragment.appendChild(div);
    });

    resultsList.appendChild(fragment);
}

// تایپ زنده
searchInput2.addEventListener("input", function() {
    fetchLiveResults(this.value);
});
