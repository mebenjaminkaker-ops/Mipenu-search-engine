<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meepno Search</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
}

.search-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 16px;
}

.search-form {
    position: relative;
    width: 100%;
    margin-bottom: 16px;
}

.search-input {
    width: 100%;
    height: 52px;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 14px;
    padding: 0 16px;
    color: #ffffff;
    font-size: 16px;
    outline: none;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    transition: border-color 0.3s;
    -webkit-appearance: none;
    appearance: none;
}

.search-input::-webkit-search-cancel-button,
.search-input::-webkit-search-decoration,
.search-input::-webkit-search-results-button,
.search-input::-webkit-search-results-decoration {
    -webkit-appearance: none;
    appearance: none;
    display: none;
}

.search-input:focus {
    border-color: rgba(255, 255, 255, 0.8);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
}

.results-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.result-item {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 14px 16px;
    border-radius: 12px;
    color: #e0e0e0;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}

.result-item:active {
    background: rgba(255, 255, 255, 0.15);
    transform: scale(0.99);
}
</style>
</head>
<body>

<div class="search-container">
    <div class="search-form" id="searchForm">
        <input 
            type="search" 
            name="mpq" 
            id="searchInput2" 
            class="search-input" 
            placeholder="جستجو کنید..." 
            inputmode="search" 
            enterkeyhint="search" 
            autofocus 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="off" 
            spellcheck="false" 
            data-lpignore="true" 
            data-1p-ignore="true" 
            data-form-type="other" 
        >
    </div>
    
    <div class="results-list" id="resultsList"></div>
</div>

<script>
"use strict";

const searchInput2 = document.getElementById("searchInput2");
const resultsList = document.getElementById("resultsList");

let debounceTimer = null;
let requestId = 0;
let activeController = null;
let activeTimeout = null;
const jsonpSlots = { google: null, ddg: null };

/* پاک‌سازی کامل اسکریپت JSONP + کالبک + تایمر */
function clearJsonp(slotName, retire) {
    const s = jsonpSlots[slotName];
    if (!s) return;
    jsonpSlots[slotName] = null;
    clearTimeout(s.timer);
    s.script.onerror = null;
    if (s.script.parentNode) s.script.parentNode.removeChild(s.script);
    if (retire) {
        // اگه اسکریپت دیر برسه، خطا نده و خودش رو پاک کنه
        window[s.cb] = function () { delete window[s.cb]; };
    } else {
        delete window[s.cb];
    }
}

/* لغو همه درخواست‌های در جریان (درخواست قدیمی نتیجه جدید رو خراب نکنه) */
function cancelPending() {
    requestId++;
    clearTimeout(activeTimeout);
    activeTimeout = null;
    if (activeController) {
        activeController.abort();
        activeController = null;
    }
    clearJsonp("google", true);
    clearJsonp("ddg", true);
}

function finishFetch(controller) {
    clearTimeout(activeTimeout);
    activeTimeout = null;
    if (activeController === controller) activeController = null;
}

function fetchLiveResults(query) {
    const trimmed = query.trim();
    cancelPending();

    if (!trimmed) {
        resultsList.innerHTML = "";
        return;
    }

    const id = requestId;
    const primaryUrl = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(trimmed)}`;
    const controller = new AbortController();
    activeController = controller;
    activeTimeout = setTimeout(() => controller.abort(), 1200);

    fetch(primaryUrl, { signal: controller.signal })
        .then(res => res.json())
        .then(data => {
            if (id !== requestId) return;
            finishFetch(controller);
            if (data && data[1] && data[1].length > 0) {
                renderResults(data[1]);
            } else {
                fetchSecondaryJSONP(trimmed);
            }
        })
        .catch(() => {
            if (id !== requestId) return;
            finishFetch(controller);
            fetchSecondaryJSONP(trimmed);
        });
}

function fetchSecondaryJSONP(query) {
    clearJsonp("google", true);

    const cb = "__meepno_cb_" + Math.random().toString(36).substr(2, 9);
    const script = document.createElement("script");
    script.id = "jsonp-suggest";

    const slot = { cb: cb, script: script, timer: null };
    jsonpSlots.google = slot;

    window[cb] = function (res) {
        if (jsonpSlots.google !== slot) {
            delete window[cb];
            return;
        }
        clearJsonp("google", false);
        if (res && res[1] && res[1].length > 0) {
            renderResults(res[1]);
        } else {
            fetchDuckDuckGoFallback(query);
        }
    };

    slot.timer = setTimeout(() => {
        if (jsonpSlots.google !== slot) return;
        clearJsonp("google", true);
        fetchDuckDuckGoFallback(query);
    }, 1000);

    script.onerror = () => {
        if (jsonpSlots.google !== slot) return;
        clearJsonp("google", false);
        fetchDuckDuckGoFallback(query);
    };

    script.src = `https://suggestqueries.google.com/complete/search?client=chrome&hl=fa&q=${encodeURIComponent(query)}&callback=${cb}`;
    document.body.appendChild(script);
}

function fetchDuckDuckGoFallback(query) {
    clearJsonp("ddg", true);

    const cb = "__meepno_ddg_" + Math.random().toString(36).substr(2, 9);
    const script = document.createElement("script");
    script.id = "ddg-suggest";

    const slot = { cb: cb, script: script, timer: null };
    jsonpSlots.ddg = slot;

    window[cb] = function (res) {
        if (jsonpSlots.ddg !== slot) {
            delete window[cb];
            return;
        }
        clearJsonp("ddg", false);
        if (res && Array.isArray(res)) {
            const list = res.map(item => item.phrase);
            renderResults(list);
        }
    };

    // تایمر ایمنی: اگه هیچ جوابی نیومد، اسکریپت و کالبک پاک بشن
    slot.timer = setTimeout(() => {
        if (jsonpSlots.ddg !== slot) return;
        clearJsonp("ddg", true);
    }, 4000);

    script.onerror = () => {
        if (jsonpSlots.ddg !== slot) return;
        clearJsonp("ddg", false);
    };

    script.src = `https://duckduckgo.com/ac/?callback=${cb}&q=${encodeURIComponent(query)}&type=list`;
    document.body.appendChild(script);
}

function renderResults(list) {
    resultsList.innerHTML = "";
    if (!list || list.length === 0) return;

    const fragment = document.createDocumentFragment();
    list.forEach(itemText => {
        const div = document.createElement("div");
        div.className = "result-item";
        div.textContent = itemText;
        fragment.appendChild(div);
    });

    resultsList.appendChild(fragment);
}

/* یک Event Listener برای همه آیتم‌ها (به‌جای یکی برای هر آیتم) */
resultsList.addEventListener("click", function (e) {
    const item = e.target.closest(".result-item");
    if (!item) return;
    window.location.href = `https://www.google.com/search?q=${encodeURIComponent(item.textContent)}`;
});

searchInput2.addEventListener("input", function () {
    clearTimeout(debounceTimer);
    const val = this.value;
    debounceTimer = setTimeout(() => {
        fetchLiveResults(val);
    }, 180);
}, { passive: true });

// بدون تگ form: جستجو با دکمه Enter / جستجوی کیبورد
searchInput2.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault();
        const q = searchInput2.value.trim();
        if (!q) return;
        clearTimeout(debounceTimer);
        cancelPending();
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
    }
});

/* پاک‌سازی هنگام خروج از صفحه */
window.addEventListener("pagehide", function () {
    clearTimeout(debounceTimer);
    cancelPending();
});
</script>
</body>
</html>
