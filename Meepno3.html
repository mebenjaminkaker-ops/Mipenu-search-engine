<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEEPNO Search Engine</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  min-height: 100vh;
  padding: 20px 16px;
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.page-wrapper {
  width: 100%;
  max-width: 850px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 25px;
  position: relative;
  z-index: 100;
}

/* لوگو بدون لینک و غیرقابل کلیک */
.logo-animated {
  direction: ltr;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #000000;
  flex-shrink: 0;
  -webkit-text-stroke: 1.2px #00ff88;
  animation: pulse-glow 3.5s ease-in-out infinite alternate;
  cursor: default;
  user-select: none;
}

@keyframes pulse-glow {
  0% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 2px rgba(0, 255, 136, 0.1);
  }
  50% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.9);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3);
  }
  100% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 2px rgba(0, 255, 136, 0.1);
  }
}

.search-container {
  position: relative;
  flex: 1;
}

.search-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 46px;
  padding: 0 16px;
  background: #000000;
  border: 1px solid #00ff88;
  border-radius: 14px;
  box-shadow: 0 0 12px rgba(0, 255, 136, 0.25), inset 0 0 8px rgba(0, 255, 136, 0.05);
  transition: box-shadow 0.3s ease, border-color 0.3s ease;
}

.search-box:focus-within {
  border-color: #00ff88;
  box-shadow: 0 0 18px rgba(0, 255, 136, 0.5), inset 0 0 10px rgba(0, 255, 136, 0.1);
}

.search-input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: #ffffff;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  text-align: right;
}

.search-input::placeholder {
  color: #ffffff;
  opacity: 0.9;
}

.search-icon-left {
  font-size: 20px;
  color: #00ff88;
  cursor: pointer;
  margin-right: 10px;
  line-height: 1;
  user-select: none;
}

/* باکس پیشنهاد کلمات (Auto-suggest Dropdown) */
.suggest-box {
  position: absolute;
  top: 52px;
  right: 0;
  left: 0;
  background: #0a0a0a;
  border: 1px solid rgba(0, 255, 136, 0.3);
  border-radius: 12px;
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 8px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.9);
  z-index: 100;
}

.suggest-item {
  padding: 10px 14px;
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
  text-align: right;
}

.suggest-item:hover, .suggest-item:active {
  background: rgba(0, 255, 136, 0.15);
  color: #00ff88;
}

/* کارت‌های نتایج نهایی (سفارشی‌شده) */
#results {
  display: grid;
  gap: 14px;
  width: 100%;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  color: white;
  text-decoration: none;
  background: linear-gradient(110deg, #211010, #121212 75%);
  border: 1px solid #353030;
  border-radius: 15px;
  transition: .2s;
}

.card:hover {
  background: #251414;
  border-color: #b33b3b;
  transform: translateY(-2px);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #352020;
  border: 1px solid #633333;
  color: #ffaaaa;
  font-size: 13px;
  font-weight: bold;
  direction: ltr;
}

.meta-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.name {
  font-size: 14px;
  font-weight: bold;
  direction: ltr;
  text-align: right;
  margin-bottom: 2px;
}

.url {
  color: #aaa;
  font-size: 11px;
  direction: ltr;
  text-align: right;
  overflow-wrap: anywhere;
}

.card-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
}

.title {
  color: #ffffff;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
  text-align: right;
}

.description {
  color: #a0a0a0;
  font-size: 12px;
  line-height: 1.6;
  text-align: right;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-box {
  padding: 30px;
  color: #aaa;
  text-align: center;
  font-size: 14px;
}

@media (max-width: 520px) {
  body { padding: 12px; }
  .logo-animated { font-size: 17px; }
  .search-box { height: 42px; padding: 0 12px; }
  .search-input { font-size: 14px; }
}
</style>
</head>
<body>

<div class="page-wrapper">

  <header>
    <span class="logo-animated">MEEPNO</span>

    <div class="search-container">
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="جستجو"
          autocomplete="off"
        >
        <span class="search-icon-left" id="searchBtn">⌕</span>
      </div>
      <!-- لیست پیشنهادات لحظه‌ای (Auto-suggest) -->
      <div class="suggest-box" id="suggestBox"></div>
    </div>
  </header>

  <main>
    <div id="statusBox" class="status-box" style="display: none;"></div>
    <section id="results"></section>
  </main>

</div>

<script>
"use strict";

const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const suggestBox = document.getElementById("suggestBox");
const resultsContainer = document.getElementById("results");
const statusBox = document.getElementById("statusBox");

/* --- سیستم ۳ لایه پیشنهاد لحظه‌ای (Auto-suggest) --- */
let debounceTimer = null;
let requestId = 0;
let activeController = null;
let activeTimeout = null;
const jsonpSlots = { google: null, ddg: null };

function clearJsonp(slotName, retire) {
    const s = jsonpSlots[slotName];
    if (!s) return;
    jsonpSlots[slotName] = null;
    clearTimeout(s.timer);
    s.script.onerror = null;
    if (s.script.parentNode) s.script.parentNode.removeChild(s.script);
    if (retire) {
        window[s.cb] = function () { delete window[s.cb]; };
    } else {
        delete window[s.cb];
    }
}

function cancelPending() {
    requestId++;
    clearTimeout(activeTimeout);
    activeTimeout = null;
    if (activeController) {
        activeController.abort();
        activeController = null;
    }
    clearJsonp("google", true);
    clearJsonp("ddg", true);
}

function fetchLiveResults(query) {
    const trimmed = query.trim();
    cancelPending();

    if (!trimmed) {
        suggestBox.style.display = "none";
        suggestBox.innerHTML = "";
        return;
    }

    const id = requestId;
    const primaryUrl = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(trimmed)}`;
    const controller = new AbortController();
    activeController = controller;
    activeTimeout = setTimeout(() => controller.abort(), 1200);

    // لایه ۱: گوگل مستقیم
    fetch(primaryUrl, { signal: controller.signal })
        .then(res => res.json())
        .then(data => {
            if (id !== requestId) return;
            if (data && data[1] && data[1].length > 0) {
                renderSuggestions(data[1]);
            } else {
                fetchSecondaryJSONP(trimmed);
            }
        })
        .catch(() => {
            if (id !== requestId) return;
            fetchSecondaryJSONP(trimmed);
        });
}

// لایه ۲: گوگل JSONP
function fetchSecondaryJSONP(query) {
    clearJsonp("google", true);

    const cb = "__meepno_cb_" + Math.random().toString(36).substr(2, 9);
    const script = document.createElement("script");
    const slot = { cb: cb, script: script, timer: null };
    jsonpSlots.google = slot;

    window[cb] = function (res) {
        if (jsonpSlots.google !== slot) return;
        clearJsonp("google", false);
        if (res && res[1] && res[1].length > 0) {
            renderSuggestions(res[1]);
        } else {
            fetchDuckDuckGoFallback(query);
        }
    };

    slot.timer = setTimeout(() => {
        if (jsonpSlots.google !== slot) return;
        clearJsonp("google", true);
        fetchDuckDuckGoFallback(query);
    }, 1000);

    script.src = `https://suggestqueries.google.com/complete/search?client=chrome&hl=fa&q=${encodeURIComponent(query)}&callback=${cb}`;
    document.body.appendChild(script);
}

// لایه ۳: DuckDuckGo Fallback
function fetchDuckDuckGoFallback(query) {
    clearJsonp("ddg", true);

    const cb = "__meepno_ddg_" + Math.random().toString(36).substr(2, 9);
    const script = document.createElement("script");
    const slot = { cb: cb, script: script, timer: null };
    jsonpSlots.ddg = slot;

    window[cb] = function (res) {
        if (jsonpSlots.ddg !== slot) return;
        clearJsonp("ddg", false);
        if (res && Array.isArray(res)) {
            const list = res.map(item => item.phrase);
            renderSuggestions(list);
        }
    };

    slot.timer = setTimeout(() => {
        if (jsonpSlots.ddg !== slot) return;
        clearJsonp("ddg", true);
    }, 3000);

    script.src = `https://duckduckgo.com/ac/?callback=${cb}&q=${encodeURIComponent(query)}&type=list`;
    document.body.appendChild(script);
}

function renderSuggestions(list) {
    suggestBox.innerHTML = "";
    if (!list || list.length === 0) {
        suggestBox.style.display = "none";
        return;
    }

    list.slice(0, 6).forEach(text => {
        const item = document.createElement("div");
        item.className = "suggest-item";
        item.textContent = text;
        item.addEventListener("click", () => {
            searchInput.value = text;
            suggestBox.style.display = "none";
            triggerFinalSearch(text);
        });
        suggestBox.appendChild(item);
    });

    suggestBox.style.display = "flex";
}

/* --- لودینگ و رندر نتایج نهایی جمنای --- */
function triggerFinalSearch(q) {
    suggestBox.style.display = "none";
    cancelPending();
    window.location.href = `./Meepno3.html?q=${encodeURIComponent(q)}`;
}

searchInput.addEventListener("input", function () {
    clearTimeout(debounceTimer);
    const val = this.value;
    debounceTimer = setTimeout(() => {
        fetchLiveResults(val);
    }, 180);
});

searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        e.preventDefault();
        const q = searchInput.value.trim();
        if (q) triggerFinalSearch(q);
    }
});

searchBtn.addEventListener("click", () => {
    const q = searchInput.value.trim();
    if (q) triggerFinalSearch(q);
});

document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-container")) {
        suggestBox.style.display = "none";
    }
});

/* اجرای سرچ جمنای موقع لود صفحه */
const urlParams = new URLSearchParams(window.location.search);
const query = urlParams.get("q");

if (query && query.trim() !== "") {
    searchInput.value = query;
    executeGeminiSearch(query);
}

async function executeGeminiSearch(searchQuery) {
    resultsContainer.innerHTML = "";
    statusBox.style.display = "block";
    statusBox.textContent = "در حال دریافت نتایج جستجو...";

    const apiKey = localStorage.getItem("meepno_gemini_key");

    if (!apiKey) {
        statusBox.innerHTML = 'کلید API یافت نشد.<br><a href="./index.html" style="color:#00ff88; text-decoration:none;">ورود به تنظیمات</a>';
        return;
    }

    const promptText = `تو موتور جستجوی MEEPNO هستی. عبارت: "${searchQuery}".
پاسخ را دقیقاً و فقط به صورت یک آرایه JSON معتبر شامل ۱۰ نتیجه مرتبط برگردان. بدون کد مارک‌داون.
کلیدها:
- siteName: اسم اصلی برند بدون ترجمه
- url: آدرس کامل (https://...)
- title: عنوان کامل صفحه
- description: خلاصه توضیحات (حداکثر ۲ جمله)`;

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });

        const data = await res.json();
        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
        
        statusBox.style.display = "none";
        renderCards(JSON.parse(rawText));
    } catch (err) {
        statusBox.textContent = "خطا در اتصال به موتور Gemini.";
    }
}

function renderCards(results) {
    resultsContainer.innerHTML = "";

    results.forEach(item => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = item.url || "#";
        card.target = "_blank";

        const iconChar = item.siteName ? item.siteName.trim().substring(0, 2).toUpperCase() : "M";

        card.innerHTML = `
            <div class="card-top">
                <div class="icon">${iconChar}</div>
                <div class="meta-info">
                    <div class="name">${item.siteName || "Site"}</div>
                    <div class="url">${item.url || "#"}</div>
                </div>
            </div>
            <div class="card-body">
                <div class="title">${item.title || ""}</div>
                <div class="description">${item.description || ""}</div>
            </div>
        `;
        resultsContainer.appendChild(card);
    });
}
</script>
</body>
</html>
