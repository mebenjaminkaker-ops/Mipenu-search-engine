<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEEPNO Search Results</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  min-height: 100vh;
  padding: 20px 16px;
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.page-wrapper {
  width: 100%;
  max-width: 850px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 30px;
}

.logo-animated {
  direction: ltr;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #000000;
  flex-shrink: 0;
  -webkit-text-stroke: 1.2px #00ff88;
  animation: pulse-glow 3.5s ease-in-out infinite alternate;
  cursor: default;
  user-select: none;
}

@keyframes pulse-glow {
  0% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 2px rgba(0, 255, 136, 0.1);
  }
  50% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.9);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3);
  }
  100% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 2px rgba(0, 255, 136, 0.1);
  }
}

.search-form {
  flex: 1;
}

.search-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 46px;
  padding: 0 16px;
  background: #000000;
  border: 1px solid #00ff88;
  border-radius: 14px;
  box-shadow: 0 0 12px rgba(0, 255, 136, 0.25), inset 0 0 8px rgba(0, 255, 136, 0.05);
}

.search-input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: #ffffff;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  text-align: right;
}

.search-icon-left {
  font-size: 20px;
  color: #00ff88;
  cursor: pointer;
  margin-right: 10px;
  user-select: none;
}

#results {
  display: grid;
  gap: 14px;
  width: 100%;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  color: white;
  text-decoration: none;
  background: linear-gradient(110deg, #211010, #121212 75%);
  border: 1px solid #353030;
  border-radius: 15px;
  transition: .2s;
}

.card:hover {
  background: #251414;
  border-color: #b33b3b;
  transform: translateY(-2px);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #352020;
  border: 1px solid #633333;
  color: #ffaaaa;
  font-size: 13px;
  font-weight: bold;
  direction: ltr;
}

.meta-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.name {
  font-size: 14px;
  font-weight: bold;
  direction: ltr;
  text-align: right;
  margin-bottom: 2px;
}

.url {
  color: #aaa;
  font-size: 11px;
  direction: ltr;
  text-align: right;
  overflow-wrap: anywhere;
}

.badge {
  margin-inline-start: auto;
  align-self: flex-start;
  flex-shrink: 0;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  color: #00ff88;
  background: rgba(0, 255, 136, 0.08);
  border: 1px solid rgba(0, 255, 136, 0.35);
  white-space: nowrap;
}

.card-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
}

.title {
  color: #ffffff;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
  text-align: right;
  overflow-wrap: anywhere;
}

.description {
  color: #a0a0a0;
  font-size: 12px;
  line-height: 1.6;
  text-align: right;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-box {
  padding: 20px;
  color: #ffaaaa;
  background: #201010;
  border: 1px solid #502020;
  border-radius: 12px;
  text-align: center;
  font-size: 13px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  margin-bottom: 14px;
}

.fallback {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
  font-size: 12px;
  color: #888;
}

.fallback a {
  color: #00ff88;
  text-decoration: none;
  padding: 6px 14px;
  border: 1px solid rgba(0, 255, 136, 0.4);
  border-radius: 20px;
}

.fallback a:hover {
  background: rgba(0, 255, 136, 0.1);
}
</style>
</head>
<body>

<div class="page-wrapper">
  <header>
    <span class="logo-animated">MEEPNO</span>
    <form class="search-form" id="searchForm">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="جستجو..." autocomplete="off" list="suggestions">
        <datalist id="suggestions"></datalist>
        <span class="search-icon-left" id="searchBtn">⌕</span>
      </div>
    </form>
  </header>

  <main>
    <div id="statusBox" class="status-box" style="display: none;"></div>
    <section id="results"></section>
    <div id="fallback" class="fallback" style="display: none;"></div>
  </main>
</div>

<script>
"use strict";

const searchInput = document.getElementById("searchInput");
const searchForm = document.getElementById("searchForm");
const searchBtn = document.getElementById("searchBtn");
const resultsContainer = document.getElementById("results");
const statusBox = document.getElementById("statusBox");
const fallbackBox = document.getElementById("fallback");
const suggestionsList = document.getElementById("suggestions");

const REQUEST_TIMEOUT = 8000;
// جریمه‌ی امتیاز برای هر نتیجه‌ی بعدی از یک منبع (برای تنوع منابع)
const SOURCE_RANK_PENALTY = 15;

/* ---------- ابزارهای عمومی ---------- */

// نرمال‌سازی: ی/ک عربی، نیم‌فاصله، اعراب، ارقام فارسی و عربی
function normalize(str) {
  return String(str || "")
    .toLowerCase()
    .replace(/ي/g, "ی")
    .replace(/ك/g, "ک")
    .replace(/[\u200c\u200d]/g, "")
    .replace(/[\u064B-\u065F\u0670]/g, "")
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
    .trim();
}

// حذف تگ‌ها و تبدیل HTML entity به متن ساده (بدون اجرای کد)
function toPlainText(html) {
  const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
  return (doc.body.textContent || "").trim();
}

function safeUrl(u) {
  try {
    const p = new URL(u);
    return (p.protocol === "http:" || p.protocol === "https:") ? p.href : null;
  } catch (e) {
    return null;
  }
}

// آدرس خوانا برای نمایش (لینک اصلی دست‌نخورده می‌مونه)
function displayUrl(u) {
  try {
    return decodeURIComponent(u);
  } catch (e) {
    return u;
  }
}

function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    prev = cur;
  }
  return prev[b.length];
}

async function getJSON(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function makeEl(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function showStatus(msg) {
  statusBox.style.display = "block";
  statusBox.textContent = msg;
}

function hideStatus() {
  statusBox.style.display = "none";
}

/* ---------- بارگذاری دیتابیس محلی ---------- */

const sitesPromise = fetch("./sites.json").then(res => {
  if (!res.ok) throw new Error("فایل sites.json پیدا نشد!");
  return res.json();
});

sitesPromise.then(sites => {
  sites.forEach(site => {
    const opt = document.createElement("option");
    opt.value = site.title;
    suggestionsList.appendChild(opt);
  });
}).catch(() => {});

/* ---------- جستجوی محلی ---------- */

function hostWord(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, "").split(".")[0].toLowerCase();
  } catch (e) {
    return "";
  }
}

function localSearch(sites, query) {
  const qn = normalize(query);
  const tokens = qn.split(/\s+/).filter(Boolean);
  const out = [];

  sites.forEach(site => {
    const title = normalize(site.title);
    const url = normalize(site.url);
    const kws = (site.keywords || []).map(normalize);
    const words = new Set(
      [...title.split(/[^a-z0-9\u0600-\u06FF]+/), ...kws, hostWord(site.url)].filter(Boolean)
    );

    let score = 0;
    if (title === qn) score += 100;
    if (title.includes(qn)) score += 50;
    if (url.includes(qn)) score += 30;
    if (kws.some(k => k === qn)) score += 60;
    else if (kws.some(k => k.includes(qn))) score += 40;

    tokens.forEach(tok => {
      let direct = false;
      if (title.includes(tok)) { score += 10; direct = true; }
      if (url.includes(tok)) { score += 5; direct = true; }
      if (kws.some(k => k.includes(tok))) { score += 8; direct = true; }

      // جستجوی فازی برای غلط تایپی
      if (!direct && tok.length >= 3) {
        const maxDist = tok.length <= 4 ? 1 : 2;
        for (const w of words) {
          if (Math.abs(w.length - tok.length) <= maxDist && levenshtein(w, tok) <= maxDist) {
            score += 6;
            break;
          }
        }
      }
    });

    if (score > 0) {
      out.push({
        title: site.title,
        url: site.url,
        desc: "دسترسی مستقیم و سریع از طریق موتور جستجوی محلی MEEPNO به این آدرس معتبر.",
        source: "محلی",
        score: score
      });
    }
  });

  return out;
}

/* ---------- جستجوی آنلاین (بدون کلید API) ---------- */

// ویکی‌پدیا، ویکی‌خبر، ویکی‌واژه: همگی API مدیاویکی یکسان دارن
async function mediaWikiSearch(project, lang, label, baseScore, query) {
  const qn = normalize(query);
  const host = `${lang}.${project}.org`;
  const data = await getJSON(
    `https://${host}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=5&format=json&origin=*`
  );
  return ((data.query && data.query.search) || []).map((it, i) => ({
    title: it.title,
    url: `https://${host}/wiki/${encodeURIComponent(it.title.replace(/ /g, "_"))}`,
    desc: toPlainText(it.snippet),
    source: label,
    score: baseScore - i * 4 + (normalize(it.title).includes(qn) ? 15 : 0)
  }));
}

async function wikidataSearch(query, lang) {
  const qn = normalize(query);
  const data = await getJSON(
    `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=${lang}&uselang=${lang}&limit=4&format=json&origin=*`
  );
  return (data.search || []).map((it, i) => ({
    title: it.label || it.id,
    url: `https://www.wikidata.org/wiki/${it.id}`,
    desc: it.description || "",
    source: "ویکی‌داده",
    score: 32 - i * 3 + (normalize(it.label).includes(qn) ? 10 : 0)
  }));
}

async function githubSearch(query) {
  const data = await getJSON(
    `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=stars&order=desc&per_page=5`
  );
  return (data.items || []).map((it, i) => ({
    title: it.full_name,
    url: it.html_url,
    desc: (it.description || "") + "  ⭐ " + it.stargazers_count,
    source: "GitHub",
    score: 30 - i * 3
  }));
}

async function stackOverflowSearch(query) {
  const data = await getJSON(
    `https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q=${encodeURIComponent(query)}&site=stackoverflow&pagesize=5`
  );
  return (data.items || []).map((it, i) => ({
    title: toPlainText(it.title),
    url: it.link,
    desc: `پاسخ‌ها: ${it.answer_count} · امتیاز: ${it.score}` + (it.is_answered ? " · پاسخ داده شده" : ""),
    source: "Stack Overflow",
    score: 28 - i * 3
  }));
}

/* ---------- ادغام و نمایش نتایج ---------- */

let allResults = [];
let pending = 0;
let sitesError = "";

function addItems(items) {
  items.forEach(it => {
    const href = safeUrl(it.url);
    if (!href) return;
    it.url = href;

    const titleKey = normalize(it.title);
    const existing = allResults.find(x =>
      x.url === it.url ||
      (x.source !== "محلی" && it.source !== "محلی" &&
       x.source === it.source && normalize(x.title) === titleKey)
    );

    if (existing) {
      if (it.score > existing.score) {
        allResults[allResults.indexOf(existing)] = it;
      }
    } else {
      allResults.push(it);
    }
  });
  renderAll();
}

// چینش متنوع: هر نتیجه‌ی بعدی از یک منبع، کمی امتیاز از دست میده
function rankResults() {
  const bySource = {};
  allResults.forEach(r => {
    (bySource[r.source] = bySource[r.source] || []).push(r);
  });
  const ranked = [];
  Object.keys(bySource).forEach(src => {
    bySource[src]
      .sort((a, b) => b.score - a.score)
      .forEach((r, idx) => {
        ranked.push({ item: r, eff: r.score - idx * SOURCE_RANK_PENALTY });
      });
  });
  return ranked.sort((a, b) => b.eff - a.eff).map(x => x.item);
}

function renderAll() {
  const sorted = rankResults();
  resultsContainer.innerHTML = "";
  if (sorted.length > 0) hideStatus();

  sorted.forEach(item => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = item.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    let siteName = "MEEPNO";
    try {
      siteName = new URL(item.url).hostname.replace(/^www\./, "");
    } catch (e) {}

    const top = makeEl("div", "card-top");
    top.appendChild(makeEl("div", "icon", siteName.substring(0, 2).toUpperCase()));

    const meta = makeEl("div", "meta-info");
    meta.appendChild(makeEl("div", "name", siteName));
    meta.appendChild(makeEl("div", "url", displayUrl(item.url)));
    top.appendChild(meta);
    top.appendChild(makeEl("span", "badge", item.source));

    const body = makeEl("div", "card-body");
    const title = makeEl("div", "title", item.title);
    title.dir = "auto";
    body.appendChild(title);
    if (item.desc) {
      const desc = makeEl("div", "description", item.desc);
      desc.dir = "auto";
      body.appendChild(desc);
    }

    card.appendChild(top);
    card.appendChild(body);
    resultsContainer.appendChild(card);
  });
}

function renderFallback(query) {
  fallbackBox.innerHTML = "";
  fallbackBox.appendChild(makeEl("span", "", "جستجو در:"));

  const engines = [
    ["DuckDuckGo", "https://duckduckgo.com/?q="],
    ["Google", "https://www.google.com/search?q="]
  ];
  engines.forEach(([name, base]) => {
    const a = makeEl("a", "", name);
    a.href = base + encodeURIComponent(query);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    fallbackBox.appendChild(a);
  });
  fallbackBox.style.display = "flex";
}

function finalize(query) {
  if (allResults.length === 0) {
    showStatus(sitesError ? "خطا در بارگذاری دیتابیس: " + sitesError : "نتیجه‌ای برای این عبارت پیدا نشد!");
  }
  renderFallback(query);
}

/* ---------- اجرای جستجو ---------- */

async function performSearch(query) {
  allResults = [];
  resultsContainer.innerHTML = "";
  fallbackBox.style.display = "none";
  showStatus("در حال جستجو در MEEPNO...");

  const hasFa = /[\u0600-\u06FF]/.test(query);
  const lang = hasFa ? "fa" : "en";

  // ۱) نتایج محلی، فوری
  try {
    const sites = await sitesPromise;
    addItems(localSearch(sites, query));
  } catch (err) {
    sitesError = err.message;
  }

  // ۲) نتایج آنلاین، هر کدوم مستقل (خرابی یکی روی بقیه اثر نداره)
  const tasks = [
    () => mediaWikiSearch("wikipedia", lang, "ویکی‌پدیا", 40, query),
    () => mediaWikiSearch("wikinews", lang, "ویکی‌خبر", 34, query),
    () => mediaWikiSearch("wiktionary", lang, "ویکی‌واژه", 26, query),
    () => wikidataSearch(query, lang),
    () => githubSearch(query),
    () => stackOverflowSearch(query)
  ];

  pending = tasks.length;
  tasks.forEach(task => {
    task()
      .then(addItems)
      .catch(() => {})
      .finally(() => {
        pending--;
        if (pending === 0) finalize(query);
      });
  });
}

/* ---------- رویدادها ---------- */

function submitQuery() {
  const val = searchInput.value.trim();
  if (val) {
    window.location.href = location.pathname + "?q=" + encodeURIComponent(val);
  }
}

searchForm.addEventListener("submit", e => {
  e.preventDefault();
  submitQuery();
});
searchBtn.addEventListener("click", submitQuery);

const urlParams = new URLSearchParams(window.location.search);
const initialQuery = urlParams.get("q");
if (initialQuery && initialQuery.trim() !== "") {
  searchInput.value = initialQuery;
  performSearch(initialQuery.trim());
}
</script>
</body>
  </html>
