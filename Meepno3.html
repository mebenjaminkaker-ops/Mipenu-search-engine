<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEEPNO Search Results</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  min-height: 100vh;
  padding: 20px 16px;
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.page-wrapper {
  width: 100%;
  max-width: 850px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 30px;
}

.logo-animated {
  direction: ltr;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #000000;
  flex-shrink: 0;
  -webkit-text-stroke: 1.2px #00ff88;
  animation: pulse-glow 3.5s ease-in-out infinite alternate;
  cursor: default;
  user-select: none;
}

@keyframes pulse-glow {
  0% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 2px rgba(0, 255, 136, 0.1);
  }
  50% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.9);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3);
  }
  100% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 2px rgba(0, 255, 136, 0.1);
  }
}

.search-form {
  flex: 1;
}

.search-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 46px;
  padding: 0 16px;
  background: #000000;
  border: 1px solid #00ff88;
  border-radius: 14px;
  box-shadow: 0 0 12px rgba(0, 255, 136, 0.25), inset 0 0 8px rgba(0, 255, 136, 0.05);
}

.search-input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: #ffffff;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  text-align: right;
}

.search-icon-left {
  font-size: 20px;
  color: #00ff88;
  cursor: pointer;
  margin-right: 10px;
  user-select: none;
}

#results {
  display: grid;
  gap: 14px;
  width: 100%;
}

/* کارت‌های نهایی شیک و استاندارد */
.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  color: white;
  text-decoration: none;
  background: linear-gradient(110deg, #211010, #121212 75%);
  border: 1px solid #353030;
  border-radius: 15px;
  transition: .2s;
}

.card:hover {
  background: #251414;
  border-color: #b33b3b;
  transform: translateY(-2px);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #352020;
  border: 1px solid #633333;
  color: #ffaaaa;
  font-size: 13px;
  font-weight: bold;
  direction: ltr;
}

.meta-info {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.name {
  font-size: 14px;
  font-weight: bold;
  direction: ltr;
  text-align: right;
  margin-bottom: 2px;
}

.url {
  color: #aaa;
  font-size: 11px;
  direction: ltr;
  text-align: right;
  overflow-wrap: anywhere;
}

.card-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
}

.title {
  color: #ffffff;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
  text-align: right;
}

.description {
  color: #a0a0a0;
  font-size: 12px;
  line-height: 1.6;
  text-align: right;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-box {
  padding: 30px;
  color: #aaa;
  text-align: center;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="page-wrapper">
  <header>
    <span class="logo-animated">MEEPNO</span>
    <form class="search-form" id="searchForm">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="جستجو" autocomplete="off">
        <span class="search-icon-left" id="searchBtn">⌕</span>
      </div>
    </form>
  </header>

  <main>
    <div id="statusBox" class="status-box" style="display: none;"></div>
    <section id="results"></section>
  </main>
</div>

<script>
"use strict";

const searchInput = document.getElementById("searchInput");
const searchForm = document.getElementById("searchForm");
const searchBtn = document.getElementById("searchBtn");
const resultsContainer = document.getElementById("results");
const statusBox = document.getElementById("statusBox");

const urlParams = new URLSearchParams(window.location.search);
const query = urlParams.get("q");

if (query && query.trim() !== "") {
  searchInput.value = query;
  executeGeminiSearch(query);
}

searchForm.addEventListener("submit", (e) => {
  e.preventDefault();
  submitQuery();
});

searchBtn.addEventListener("click", () => {
  submitQuery();
});

function submitQuery() {
  const val = searchInput.value.trim();
  if (val) {
    window.location.href = `./Meepno3.html?q=${encodeURIComponent(val)}`;
  }
}

async function executeGeminiSearch(searchQuery) {
  resultsContainer.innerHTML = "";
  statusBox.style.display = "block";
  statusBox.textContent = "در حال دریافت نتایج از هوش مصنوعی...";

  // خواندن کلید ثبت‌شده در صفحه تنظیمات اصلی
  const apiKey = localStorage.getItem("meepno_gemini_key");

  if (!apiKey) {
    statusBox.innerHTML = 'کلید Gemini API یافت نشد.<br><br><a href="./index-mobile.html" style="color:#00ff88; text-decoration:none;">رفتن به تنظیمات و ورود کلید</a>';
    return;
  }

  const promptText = `تو موتور جستجوی MEEPNO هستی. عبارت جستجوی کاربر: "${searchQuery}".
پاسخ را دقیقاً و فقط به صورت یک آرایه JSON معتبر شامل ۱۰ نتیجه مرتبط برگردان. هیچ متن اضافه یا کدهای مارک‌داون (مثل \`\`\`json) ننویس.
هر عضو آرایه باید دقیقاً شامل این کلیدها باشد:
- siteName: اسم اصلی و برند رسمی سایت بدون ترجمه (مثلاً GitHub, Wikipedia, YouTube)
- url: لینک کامل صفحه (https://...)
- title: عنوان کامل و جذاب صفحه
- description: خلاصه توضیحات کاربردی درباره صفحه (حداکثر ۲ جمله)`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
    });

    const data = await res.json();
    
    if (data.error) {
      statusBox.textContent = "خطا از طرف سرور جمنای: " + data.error.message;
      return;
    }

    let rawText = data.candidates[0].content.parts[0].text;
    rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
    
    const parsedResults = JSON.parse(rawText);
    
    if (Array.isArray(parsedResults) && parsedResults.length > 0) {
      statusBox.style.display = "none";
      renderCards(parsedResults);
    } else {
      statusBox.textContent = "نتیجه‌ای دریافت نشد.";
    }

  } catch (err) {
    statusBox.textContent = "خطا در پردازش یا اتصال به جمنای. لطفاً کلید API را بررسی کنید.";
  }
}

function renderCards(results) {
  resultsContainer.innerHTML = "";

  results.forEach(item => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = item.url || "#";
    card.target = "_blank";

    const iconChar = item.siteName ? item.siteName.trim().substring(0, 2).toUpperCase() : "M";

    card.innerHTML = `
      <div class="card-top">
        <div class="icon">${iconChar}</div>
        <div class="meta-info">
          <div class="name">${item.siteName || "Site"}</div>
          <div class="url">${item.url || "#"}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="title">${item.title || ""}</div>
        <div class="description">${item.description || ""}</div>
      </div>
    `;

    resultsContainer.appendChild(card);
  });
}
</script>
</body>
</html>
