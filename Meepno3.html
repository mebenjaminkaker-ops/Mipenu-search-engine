<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEEPNO Search</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

.page-wrapper {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 16px;
  flex-shrink: 0;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.logo-animated {
  direction: ltr;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #000000;
  flex-shrink: 0;
  -webkit-text-stroke: 1.2px #00ff88;
  animation: pulse-glow 3.5s ease-in-out infinite alternate;
  cursor: default;
  user-select: none;
}

@keyframes pulse-glow {
  0% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 2px rgba(0, 255, 136, 0.1);
  }
  50% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.9);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.6), 0 0 20px rgba(0, 255, 136, 0.3);
  }
  100% {
    -webkit-text-stroke-color: rgba(0, 255, 136, 0.2);
    text-shadow: 0 0 2px rgba(0, 255, 136, 0.1);
  }
}

.search-form {
  flex: 1;
}

.search-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 46px;
  padding: 0 16px;
  background: #000000;
  border: 1px solid #00ff88;
  border-radius: 14px;
  box-shadow: 0 0 12px rgba(0, 255, 136, 0.25), inset 0 0 8px rgba(0, 255, 136, 0.05);
}

.search-input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: #ffffff;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  text-align: right;
}

.search-icon-left {
  font-size: 20px;
  color: #00ff88;
  cursor: pointer;
  margin-right: 10px;
  user-select: none;
}

/* بخش کادر نمایشگر گوگل با قابلیت فریم */
.browser-container {
  flex: 1;
  width: 100%;
  position: relative;
  background: #ffffff;
  margin-top: 15px;
  border-top: 1px solid #222;
  overflow: hidden;
}

/* این تیکه فریم رو لود می‌کنه و طوری تنظیمش می‌کنیم که بخش زاید بالای گوگل برش بخوره */
iframe {
  width: 100%;
  height: calc(100vh - 100px);
  border: none;
  background: #121212;
}
</style>
</head>
<body>

<div class="page-wrapper">
  <header>
    <span class="logo-animated">MEEPNO</span>
    <form class="search-form" id="searchForm">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="جستجو..." autocomplete="off">
        <span class="search-icon-left" id="searchBtn">⌕</span>
      </div>
    </form>
  </header>
</div>

<div class="browser-container">
  <iframe id="searchFrame" src="about:blank"></iframe>
</div>

<script>
"use strict";

const searchInput = document.getElementById("searchInput");
const searchForm = document.getElementById("searchForm");
const searchBtn = document.getElementById("searchBtn");
const searchFrame = document.getElementById("searchFrame");

// گرفتن کوئری از URL موقع لود صفحه
const urlParams = new URLSearchParams(window.location.search);
const query = urlParams.get("q");

if (query && query.trim() !== "") {
  searchInput.value = query;
  loadGoogleSearch(query);
} else {
  // صفحه پیش‌فرض گوگل اگر چیزی سرچ نشده بود
  searchFrame.src = "https://www.google.com/ncr";
}

searchForm.addEventListener("submit", (e) => {
  e.preventDefault();
  submitQuery();
});

searchBtn.addEventListener("click", () => {
  submitQuery();
});

function submitQuery() {
  const val = searchInput.value.trim();
  if (val) {
    window.location.href = `./Meepno3.html?q=${encodeURIComponent(val)}`;
  }
}

function loadGoogleSearch(searchQuery) {
  // آدرس جستجوی مستقیم گوگل
  const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(searchQuery)}&igu=1`;
  searchFrame.src = googleSearchUrl;
}
</script>
</body>
  </html>
