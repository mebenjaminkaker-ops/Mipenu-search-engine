<html>

    <meta charset="UTF-8">
    <script>
        // اگه گوشی بود میره رو صفحه اصلی موبایل، اگه دسکتاپ بود میره رو صفحه دسکتاپ
        if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768) {
            window.location.replace("index-mobile.html");
        } else {
            window.location.replace("index-desktop.html");
        }
    </script>
</head>
